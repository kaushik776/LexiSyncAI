[server]
maxUploadSize = 60            # MB, same limit as URL downloads
enableStaticServing = true    # serves static/ (the bundled fonts) so the app looks the same offline

[browser]
gatherUsageStats = false      # no usage data sent to Streamlit

[client]
toolbarMode = "minimal"       # hide the "Deploy" button; keep only the menu

[theme]
base = "dark"
primaryColor = "#7c9cff"              # soft blue accent
backgroundColor = "#0e1117"           # deep charcoal
secondaryBackgroundColor = "#161b24"  # panels, sidebar, inputs
textColor = "#e6e9ef"
linkColor = "#9db4ff"
borderColor = "#262d39"
showWidgetBorder = true
baseRadius = "0.55rem"
buttonRadius = "0.55rem"
font = "Plus Jakarta Sans, sans-serif"
headingFont = "Plus Jakarta Sans, sans-serif"
baseFontSize = 16
headingFontWeights = [700, 700, 600, 600, 600, 600]
headingFontSizes = ["1.8rem", "1.45rem", "1.2rem", "1.08rem", "1rem", "0.95rem"]
dataframeHeaderBackgroundColor = "#1b212c"
codeBackgroundColor = "#161b24"

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/PlusJakartaSans-400.ttf"
weight = 400

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/PlusJakartaSans-500.ttf"
weight = 500

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/PlusJakartaSans-600.ttf"
weight = 600

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/PlusJakartaSans-700.ttf"
weight = 700

[[theme.fontFaces]]
family = "Lora"
url = "app/static/fonts/Lora-500.ttf"
weight = 500

[[theme.fontFaces]]
family = "Lora"
url = "app/static/fonts/Lora-600.ttf"
weight = 600

[[theme.fontFaces]]
family = "Lora"
url = "app/static/fonts/Lora-700.ttf"
weight = 700
